<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | YatraSathi</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00f2fe',
                        accent: '#facc15',
                        dark: '#07090f',
                        surface: '#111827',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .auth-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .auth-logo i {
            color: var(--primary);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .auth-tab {
            flex: 1;
            padding: 1rem;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
        }

        .auth-tab.active {
            color: var(--primary);
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .auth-form {
            display: none;
            animation: fadeUpIn 0.4s ease forwards;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .auth-form .form-group label {
            margin-bottom: 0.5rem;
            display: block;
            font-size: 0.9rem;
        }

        .auth-form .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 1.1rem;
        }

        .social-auth {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-social {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Ambient glowing orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.5;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: var(--primary);
            top: 10%;
            left: 20%;
            animation: float 10s infinite alternate;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--accent);
            bottom: 10%;
            right: 15%;
            animation: float 12s infinite alternate-reverse;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-container w-full min-h-screen flex items-center justify-center p-4">
        <div class="glass-card auth-card w-full max-w-md p-10 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.6)] ring-1 ring-white/10 relative overflow-hidden">
            <!-- decorative background glows -->
            <div class="absolute -top-32 -left-32 w-64 h-64 bg-primary/20 rounded-full blur-[80px] pointer-events-none"></div>
            <div class="absolute -bottom-32 -right-32 w-64 h-64 bg-accent/20 rounded-full blur-[80px] pointer-events-none"></div>

            <a href="index.html" class="auth-logo text-3xl font-extrabold flex justify-center items-center gap-3 mb-8 transition-transform hover:scale-105">
                <i class="fa-solid fa-map-location-dot text-primary drop-shadow-[0_0_15px_rgba(0,242,254,0.8)]"></i> YatraSathi
            </a>
            
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('signin')">Sign In</div>
                <div class="auth-tab" onclick="switchTab('signup')">Sign Up</div>
            </div>

            <!-- Sign In Form -->
            <form id="signin-form" class="auth-form active" action="dashboard.html">
                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <input type="email" id="signin-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" placeholder="••••••••" required>
                </div>
                <div style="text-align: right; margin-bottom: 1rem; margin-top: -0.5rem;">
                    <a href="#" style="color: var(--primary); font-size: 0.85rem; text-decoration: none;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary glow-effect auth-btn">Access Account</button>
                
                <div class="social-auth">
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Or continue with</p>
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
                    </button>
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-github"></i> GitHub
                    </button>
                </div>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" class="auth-form" action="dashboard.html">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a strong password" required>
                </div>
                <button type="submit" class="btn btn-primary glow-effect auth-btn">Create Account</button>

                <div class="social-auth">
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Or sign up with</p>
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));

            if(tabId === 'signin') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('signin-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }

        // Handle Signup
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            // Store user data as JSON in localStorage
            const userData = { name: name, email: email, password: password };
            localStorage.setItem('yatrasathi_user', JSON.stringify(userData));
            
            // Redirect to home page
            window.location.href = 'dashboard.html';
        });

        // Handle Signin
        document.getElementById('signin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            // Simple validation against stored data, or just mock it and proceed
            const storedData = JSON.parse(localStorage.getItem('yatrasathi_user'));
            if (storedData && storedData.email === email && storedData.password === password) {
                // Login successful
                window.location.href = 'dashboard.html';
            } else if (!storedData) {
                // If no user exists, let's create a mock session anyway for demonstration
                const userData = { name: "Traveler", email: email, password: password };
                localStorage.setItem('yatrasathi_user', JSON.stringify(userData));
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid email or password.');
            }
        });
    </script>
</body>
</html>
